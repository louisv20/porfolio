[build]
  # Combined build command for existing app and quiz-app
  command = "npm run build"
  publish = "dist"
  functions = "functions"

[dev]
  publish = "."

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[functions.subscribe]
  included_files = ["functions/subscribe.js"]
  external_node_modules = ["mongoose"]

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "http://localhost:5173"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Redirects for quiz-app (supports client-side routing)
[[redirects]]
  from = "/quiz-app/*"
  to = "/quiz-app/index.html"
  status = 200

# Redirects for existing app (if it’s a single-page app)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200