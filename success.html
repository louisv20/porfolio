<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Success</title>
</head>
<body>
  <h1>Payment Successful!</h1>
  <p>Your trial is now active. You can close this tab and return to the extension.</p>
  <script>
    // Retrieve device hash and source from URL
    const urlParams = new URLSearchParams(window.location.search);
    const deviceHash = urlParams.get('device');
    const source = urlParams.get('source'); // Extension ID

    if (deviceHash && source) {
      // Send message to the Chrome extension
      chrome.runtime.sendMessage(source, {
        action: 'payment_success',
        deviceHash: deviceHash
      }, (response) => {
        if (chrome.runtime.lastError) {
          console.error('Error sending message:', chrome.runtime.lastError);
        } else {
          console.log('Payment success message sent to extension');
        }
      });
    } else {
      console.error('Missing device hash or source in URL');
    }
  </script>
</body>
</html>
