<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Success</title>
</head>
<body>
  <h1>Payment Successful!</h1>
  <p>Your trial is now active. You can close this tab and return to the extension.</p>
  <div id="status-message"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const deviceHash = urlParams.get('device');
    const source = urlParams.get('source');
    const token = urlParams.get('token');
    const statusMessage = document.getElementById('status-message');

    function showStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.style.color = isError ? 'red' : 'green';
    }

    if (deviceHash && source && token) {
      if (typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.sendMessage) {
        chrome.runtime.sendMessage(source, {
          action: 'payment_success',
          deviceHash: deviceHash,
          token: token
        }, (response) => {
          if (chrome.runtime.lastError) {
            console.error('Error sending message:', chrome.runtime.lastError);
            showStatus('Failed to activate trial. Please ensure the extension is installed.', true);
          } else if (response && response.success) {
            showStatus('Trial activated successfully!');
          } else {
            console.error('Invalid response:', response);
            showStatus('Trial activation failed. Please try again.', true);
          }
        });
      } else {
        console.error('Chrome runtime not available');
        showStatus('Please ensure you are using Chrome with the extension installed.', true);
      }
    } else {
      console.error('Missing device, source, or token in URL');
      showStatus('Invalid success URL. Please contact support.', true);
    }
  </script>
</body>
</html>
